<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaFilm — Библиотека</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="logo">LinguaFilm</div>
        <nav class="nav">
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="library.html" class="active">Библиотека</a></li>
                <li><a href="profile.html">Профиль</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <section id="library" class="library">
            <h1>Библиотека фрагментов</h1>
            <div class="filter">
                <label>Уровень:
                    <select id="levelFilter">
                        <option value="all">Все</option>
                        <option value="a1">A1–A2</option>
                        <option value="b1">B1–B2</option>
                        <option value="c1">C1–C2</option>
                    </select>
                </label>
                <label>Жанр:
                    <select id="genreFilter">
                        <option value="all">Все</option>
                        <option value="comedy">Комедия</option>
                        <option value="drama">Драма</option>
                        <option value="animation">Мультфильм</option>
                    </select>
                </label>
            </div>
            <div id="clipsContainer" class="clips"></div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 LinguaFilm. Все права защищены.</p>
    </footer>

    <script src="script_library.js"></script>

</body>
</html>
