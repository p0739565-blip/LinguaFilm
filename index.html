<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaFilm — учим язык по фильмам</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="logo">LinguaFilm</div>
        <nav class="nav">
            <ul>
                <li><a href="#home">Главная</a></li>
                <li><a href="#library">Библиотека</a></li>
                <li><a href="#profile">Профиль</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <section id="home" class="hero">
            <h1>Учи язык через кино и мультфильмы!</h1>
            <p>Смотрите фрагменты, повторяйте фразы, улучшайте понимание на слух.</p>
            <button id="startButton">Начать обучение</button>
        </section>

        <section id="library" class="library">
            <h2>Библиотека фрагментов</h2>
            <div class="filter">
                <label>Уровень:
                    <select id="levelFilter">
                        <option value="all">Все</option>
                        <option value="a1">A1–A2</option>
                        <option value="b1">B1–B2</option>
                        <option value="c1">C1–C2</option>
                    </select>
                </label>
                <label>Жанр:
                    <select id="genreFilter">
                        <option value="all">Все</option>
                        <option value="comedy">Комедия</option>
                        <option value="drama">Драма</option>
                        <option value="animation">Мультфильм</option>
                    </select>
                </label>
            </div>
            <div id="clipsContainer" class="clips"></div>
        </section>

        <section id="player" class="player hidden">
            <div class="video-container">
                <video id="clipVideo" controls></video>
            </div>
            <div class="transcript">
                <h3>Транскрипция и перевод</h3>
                <ul id="transcriptList"></ul>
            </div>
            <button id="closePlayer">Закрыть</button>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 LinguaFilm. Все права защищены.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
